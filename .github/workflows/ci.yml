name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and test tools
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: Verify installed CLI quickstart
        run: budget-pair-check analyze examples/manifest.json examples/runs.json --format json
